# WiFi-specific security configuration

[device-wifi-security]
# WiFi scanning and connection security

# Randomize MAC during scans
wifi.scan-rand-mac-address=yes

# Use stable-per-network MAC for connections (better for development)
# This provides privacy while avoiding connection issues
# Note: This setting is also in security.conf - that one takes precedence
wifi.cloned-mac-address=stable-ssid

# For maximum privacy (may cause connection issues):
# wifi.cloned-mac-address=random

# For trusted networks (disable randomization):
# wifi.cloned-mac-address=preserve

[connection-wifi-security]
# Connection-specific WiFi security

# Prefer secure connection methods
wifi-sec.key-mgmt=wpa-psk,wpa-eap,sae

# Disable legacy security
wifi-sec.proto=rsn
wifi-sec.pairwise=ccmp
wifi-sec.group=ccmp

# =====================================
# DEVELOPMENT CONSIDERATIONS
# =====================================
# For development environments where you need to connect to various networks:
#
# 1. Corporate Networks: Some may require specific security settings
#    - Uncomment wifi.cloned-mac-address=preserve for corporate networks
#    - May need to adjust key management for WPA Enterprise
#
# 2. Home Networks: Balance security and convenience
#    - stable-ssid MAC randomization is usually sufficient
#    - WPA3 (SAE) preferred when available
#
# 3. Public Networks: Maximum security
#    - Always use random MAC addresses
#    - Avoid connecting to open networks when possible
#    - Use VPN on untrusted networks
#
# =====================================
# TROUBLESHOOTING
# =====================================
# If experiencing WiFi connection issues:
#
# 1. Check current MAC randomization: nmcli device wifi list
# 2. Disable MAC randomization temporarily: 
#    nmcli connection modify <connection> wifi.cloned-mac-address ""
# 3. Reset network settings: nmcli connection reload
# 4. View detailed logs: journalctl -u NetworkManager -f