# Backup DNS configuration
# This file provides fallback DNS configuration if unbound fails

[Resolve]
# These settings are only used if the primary DNS configuration fails
# They are overridden by unbound-integration.conf when unbound is running

# Backup secure DNS servers (uncomment if needed)
#FallbackDNS=1.1.1.1#cloudflare-dns.com 9.9.9.9#dns.quad9.net

# =====================================
# EMERGENCY DNS CONFIGURATION
# =====================================
# In case of complete DNS failure, you can manually uncomment these entries
# and restart systemd-resolved: systemctl restart systemd-resolved

# Standard secure DNS without DoT (for compatibility)
#DNS=1.1.1.1 9.9.9.9

# Alternative secure DNS providers:
#DNS=8.8.8.8 8.8.4.4  # Google Public DNS
#DNS=1.0.0.1 1.1.1.1  # Cloudflare Public DNS

# Enable DoT on backup servers (if unbound is completely broken)
#DNSOverTLS=yes
#DNSSEC=yes

# =====================================
# TROUBLESHOOTING COMMANDS
# =====================================
# Check DNS resolution: resolvectl status
# Flush DNS cache: resolvectl flush-caches  
# Query specific DNS: resolvectl query example.com
# Check configuration: systemd-resolve --status
# Monitor logs: journalctl -u systemd-resolved -f