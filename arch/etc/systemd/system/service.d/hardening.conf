# Developer-friendly service hardening template
# Balances security with development tool compatibility
# 
# NOTE: This template is applied automatically to services.
# For development services that need more privileges:
# 1. Override specific settings in service files
# 2. Create custom .service files in /etc/systemd/system/
# 3. Use systemctl edit <service> to add overrides

[Service]
# Memory protection (disabled for JIT compatibility)
# MemoryDenyWriteExecute=yes  # Blocks Node.js V8, Java, .NET JIT

# Filesystem protection (developer-friendly)
ProtectSystem=full
# ProtectHome=read-only  # Blocks development databases writing to /home
PrivateTmp=yes

# Kernel protection (safe for most services)
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectControlGroups=yes

# Network restrictions (basic protection)
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX

# System call filtering (relaxed for compatibility)
SystemCallFilter=@system-service
SystemCallFilter=~@reboot @swap

# Namespace restrictions (relaxed for containers)
# RestrictNamespaces=yes  # Blocks Docker/Podman

# Privilege restrictions
NoNewPrivileges=yes
LockPersonality=yes
RestrictRealtime=yes
RemoveIPC=yes

# Capability restrictions (allow basic capabilities)
# CapabilityBoundingSet=  # Empty set blocks everything
