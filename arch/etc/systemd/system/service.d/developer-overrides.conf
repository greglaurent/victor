# Developer service overrides template
# Copy and customize this for development services that need more privileges
#
# Usage examples:
# 1. Docker: systemctl edit docker.service
# 2. Database: systemctl edit postgresql.service  
# 3. Development server: Create custom .service file
#
# Common overrides needed for development services:

[Service]
# Allow JIT compilation (Node.js, Java, .NET, etc.)
MemoryDenyWriteExecute=no

# Allow home directory access (databases, development files)
ProtectHome=no

# Allow namespace usage (Docker, containers)
RestrictNamespaces=no

# Allow filesystem modifications (databases, build tools)
ProtectSystem=no

# Allow additional capabilities as needed
# Example for Docker:
# CapabilityBoundingSet=CAP_SYS_ADMIN CAP_DAC_OVERRIDE CAP_NET_ADMIN

# Allow additional syscalls as needed  
# Example for containers:
# SystemCallFilter=@system-service @mount

# Example complete override for Docker service:
# [Service]
# MemoryDenyWriteExecute=no
# ProtectHome=no
# RestrictNamespaces=no
# ProtectSystem=no
# CapabilityBoundingSet=CAP_SYS_ADMIN CAP_DAC_OVERRIDE CAP_NET_ADMIN CAP_NET_BIND_SERVICE
# SystemCallFilter=@system-service @mount @network-io
