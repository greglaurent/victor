# Developer-specific systemd service overrides
# Use this to disable hardening for development tools that need special permissions
# 
# Apply to specific services by creating:
# /etc/systemd/system/SERVICE_NAME.service.d/override.conf
#
# Common development services that need overrides:
# - docker.service
# - containerd.service  
# - libvirtd.service
# - code-server.service
# - Any custom development services

[Service]
# Override restrictive hardening for development services
# Copy these settings to service-specific override files as needed

# Allow memory execution (needed for JITs, interpreters)
# MemoryDenyWriteExecute=no

# Allow system access (needed for build tools, compilers)
# ProtectSystem=false

# Allow full network access (needed for development servers)
# RestrictAddressFamilies=

# Allow broader syscalls (needed for development tools)
# SystemCallFilter=

# Allow namespaces (needed for containers, sandboxing)
# RestrictNamespaces=no

# Allow realtime scheduling (needed for multimedia development)
# RestrictRealtime=no

# Grant specific capabilities as needed
# CapabilityBoundingSet=CAP_SYS_ADMIN CAP_SYS_PTRACE