# systemd-timesyncd configuration
# Simple, secure time synchronization

[Time]
# Secure time servers (same as chrony was using)
NTP=time.cloudflare.com ntppool1.time.nl nts.netnod.se ptbtime1.ptb.de
FallbackNTP=0.arch.pool.ntp.org 1.arch.pool.ntp.org 2.arch.pool.ntp.org 3.arch.pool.ntp.org

# Use NTS (Network Time Security) when available
# Note: systemd-timesyncd doesn't support NTS yet, but this is future-ready
