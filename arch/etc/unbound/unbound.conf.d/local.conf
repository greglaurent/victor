# Local DNS configuration
# Add custom zones and overrides here

# Example local development zone:
# local-zone: "dev.local" static
# local-data: "app.dev.local A 127.0.0.1"
# local-data: "api.dev.local A 127.0.0.1"
# local-data: "db.dev.local A 127.0.0.1"

# Docker/Kubernetes development:
# local-data: "host.docker.internal A 127.0.0.1"
# local-data: "kubernetes.docker.internal A 127.0.0.1"

# Block known malicious domains (uncomment to enable)
# include: /etc/unbound/unbound.conf.d/blocklist.conf

# =====================================
# DEVELOPMENT DNS OVERRIDES
# =====================================
# Use this section to override DNS for development purposes
# Format: local-data: "hostname A ip_address"

# Example: Route production API to local development server
# local-data: "api.production-app.com A 127.0.0.1"

# Example: Route CDN to local files for development
# local-data: "cdn.example.com A 127.0.0.1"

# =====================================
# PRIVACY/SECURITY BLOCKS
# =====================================
# Uncomment entries below to block tracking/analytics domains locally
# This provides privacy and can be useful for testing ad-free environments

# Common analytics and tracking:
# local-zone: "google-analytics.com" refuse
# local-zone: "googletagmanager.com" refuse  
# local-zone: "doubleclick.net" refuse
# local-zone: "facebook.com" refuse
# local-zone: "connect.facebook.net" refuse

# Microsoft telemetry (useful for VMs/Wine):
# local-zone: "telemetry.microsoft.com" refuse
# local-zone: "vortex.data.microsoft.com" refuse
# local-zone: "settings-win.data.microsoft.com" refuse

# =====================================
# NOTES
# =====================================
# - Changes to this file require unbound restart: systemctl restart unbound
# - Test configuration: unbound-checkconf
# - Monitor queries: unbound-control dump_cache | head
# - Flush cache: unbound-control flush_zone .
# - For complex rules, consider creating separate .conf files in this directory