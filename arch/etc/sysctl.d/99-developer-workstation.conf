# /etc/sysctl.d/99-developer-workstation.conf
# Security hardening optimized for development workstations
# Balances security with virtualization, containers, and debugging needs

# =====================================
# MEMORY PROTECTION (Safe for dev work)
# =====================================

# Improve ASLR effectiveness for mmap
vm.mmap_rnd_bits = 32
vm.mmap_rnd_compat_bits = 16

# Restrict userfaultfd to processes with CAP_SYS_PTRACE
vm.unprivileged_userfaultfd = 0

# =====================================
# KERNEL INFORMATION PROTECTION
# =====================================

# Restrict dmesg to CAP_SYS_LOG
kernel.dmesg_restrict = 1

# Restrict access to /proc and kernel pointer info
# Level 1 allows debugging own processes (developer-friendly)
kernel.kptr_restrict = 1

# Developer-friendly ptrace scope
# 1 = restrict to same uid and CAP_SYS_PTRACE (allows debugging)
kernel.yama.ptrace_scope = 1

# =====================================
# FILESYSTEM PROTECTION
# =====================================

# Enable filesystem protection sysctls
fs.protected_regular = 2
fs.protected_fifos = 2
fs.protected_symlinks = 1
fs.protected_hardlinks = 1

# Disable core dumps (security)
kernel.core_pattern = |/bin/false
fs.suid_dumpable = 0

# =====================================
# NETWORK SECURITY (Dev-friendly)
# =====================================

# Basic IP spoofing mitigation
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1

# SYN flood protection
net.ipv4.tcp_syncookies = 1

# Protection against time-wait assassination attacks
net.ipv4.tcp_rfc1337 = 1

# Ignore bogus ICMP responses
net.ipv4.icmp_ignore_bogus_error_responses = 1

# Don't send ICMP redirects (we're not a router)
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0

# Don't accept ICMP redirects
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0

# Enable TCP timestamps
net.ipv4.tcp_timestamps = 1

# =====================================
# CONTAINER/VIRTUALIZATION SUPPORT
# =====================================

# REQUIRED for Flatpak, containers, and user namespaces
kernel.unprivileged_userns_clone = 1

# Restrict eBPF to CAP_BPF
kernel.unprivileged_bpf_disabled = 1
net.core.bpf_jit_harden = 2

# Enable IP forwarding for VM networking and containers
net.ipv4.ip_forward = 1
net.ipv6.conf.all.forwarding = 1

# =====================================
# PERFORMANCE TUNING
# =====================================

# Restrict performance events (security vs debugging balance)
# Level 1: Allow user profiling own processes (better for development)
kernel.perf_event_paranoid = 1

# =====================================
# DEVELOPER TOOL SUPPORT
# =====================================

# Allow slightly more liberal core dumps for development debugging
# (still restricted by fs.suid_dumpable = 0 above)
kernel.core_uses_pid = 1

# Increase file handles for development workloads
fs.file-max = 65536

# Increase inotify limits for IDEs and file watchers
fs.inotify.max_user_watches = 524288
fs.inotify.max_user_instances = 8192

# Increase process limits for development
kernel.pid_max = 65536
