# OpenSSL configuration template for development certificates
# Copy and modify this file for custom certificate configurations

[req]
distinguished_name = req_distinguished_name
req_extensions = v3_req
prompt = no

[req_distinguished_name]
C = US
ST = Development
L = Local  
O = Development
OU = Development Team
CN = {{DOMAIN}}  # Replace with your domain

[v3_req]
basicConstraints = CA:FALSE
keyUsage = critical,digitalSignature,keyEncipherment
extendedKeyUsage = serverAuth,clientAuth
subjectAltName = @alt_names

[alt_names]
# Add your development domains here
DNS.1 = {{DOMAIN}}
DNS.2 = *.{{DOMAIN}}

# Common development domains
DNS.3 = localhost
DNS.4 = *.localhost
DNS.5 = dev.local
DNS.6 = *.dev.local
DNS.7 = test.local
DNS.8 = *.test.local

# Add your API endpoints
DNS.9 = api.{{DOMAIN}}
DNS.10 = admin.{{DOMAIN}}
DNS.11 = app.{{DOMAIN}}

# Local IP addresses
IP.1 = 127.0.0.1
IP.2 = ::1

# Add your development machine IP if needed
# IP.3 = 192.168.1.100

# =============================================================================
# COMMON DEVELOPMENT DOMAINS
# =============================================================================
#
# Popular development domain patterns:
#
# Framework defaults:
# - React: localhost:3000
# - Vue.js: localhost:8080  
# - Angular: localhost:4200
# - Express: localhost:3000
# - Django: localhost:8000
# - Flask: localhost:5000
# - Spring Boot: localhost:8080
# - Rails: localhost:3000
#
# Recommended development domains:
# - *.dev.local (for main applications)
# - *.test.local (for testing environments)
# - *.stage.local (for staging)
# - api.dev.local (for API services)
# - admin.dev.local (for admin interfaces)
#
# =============================================================================
# BROWSER CONSIDERATIONS  
# =============================================================================
#
# Chrome/Chromium:
# - Supports .localhost domains natively  
# - Requires CA certificate import for custom domains
# - May show warnings for self-signed certificates
#
# Firefox:
# - Supports .localhost domains natively
# - Requires CA certificate import for custom domains  
# - Has stricter certificate validation
#
# Safari:
# - May require additional keychain configuration
# - Supports .local domains with mDNS
#
# =============================================================================
# USAGE EXAMPLES
# =============================================================================
#
# 1. Create certificate for specific domain:
#    sed 's/{{DOMAIN}}/myapp.dev.local/g' development.conf > myapp.conf
#    dev-cert create myapp.dev.local
#
# 2. Create wildcard certificate:
#    sed 's/{{DOMAIN}}/dev.local/g' development.conf > wildcard.conf  
#    # Edit alt_names section to add DNS.1 = *.dev.local
#    dev-cert create dev.local
#
# 3. Add custom domains to /etc/hosts:
#    echo "127.0.0.1 myapp.dev.local api.dev.local" >> /etc/hosts
#
# =============================================================================