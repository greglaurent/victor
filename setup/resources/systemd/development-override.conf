# Development systemd service override template
# Copy this file to /etc/systemd/system/SERVICE.service.d/99-development.conf
# Replace SERVICE with your actual service name
#
# This disables restrictive hardening that breaks development tools

[Service]
# Allow memory execution (needed for JIT compilers, interpreters, dynamic loading)
# Required for: Node.js, Python, Java, .NET, Rust debugging, Go, interpreters
MemoryDenyWriteExecute=no

# Relax filesystem protection (needed for development file access)
# Required for: Build tools, IDEs, file watchers, hot reload, asset compilation
ProtectSystem=false
ProtectHome=no
PrivateTmp=no

# Relax kernel protection (needed for some development tools)
# Required for: System monitoring tools, profilers, debuggers
ProtectKernelTunables=no
ProtectKernelModules=no
ProtectControlGroups=no

# Allow full network access (needed for development servers and tools)
# Required for: Development servers, API testing, webhooks, proxy tools
RestrictAddressFamilies=

# Allow broader system calls (needed for development and build processes)
# Required for: Compilers, build systems, testing frameworks, debugging tools
SystemCallFilter=

# Allow namespaces (needed for containers and sandboxing)
# Required for: Docker, Podman, testing environments, isolated builds
RestrictNamespaces=no

# Allow realtime scheduling (needed for multimedia and performance-critical development)
# Required for: Audio/video development, game development, real-time applications
RestrictRealtime=no

# Relax privilege restrictions (needed for development automation)
# Required for: Package managers, system integration testing, service management
NoNewPrivileges=no
LockPersonality=no
RemoveIPC=no

# Grant essential development capabilities
# CAP_SYS_ADMIN: Container management, system monitoring, advanced debugging
# CAP_SYS_PTRACE: Debugging, profiling, tracing applications
# CAP_DAC_OVERRIDE: File access for builds, IDEs working across user boundaries
# CAP_SETUID/SETGID: Multi-user testing, privilege dropping in applications
# CAP_NET_BIND_SERVICE: Binding to privileged ports (< 1024) for development
CapabilityBoundingSet=CAP_SYS_ADMIN CAP_SYS_PTRACE CAP_DAC_OVERRIDE CAP_SETUID CAP_SETGID CAP_NET_BIND_SERVICE

# =============================================================================
# USAGE INSTRUCTIONS
# =============================================================================
#
# 1. Copy this file to your service override directory:
#    sudo mkdir -p /etc/systemd/system/SERVICE.service.d/
#    sudo cp development-override.conf /etc/systemd/system/SERVICE.service.d/99-development.conf
#
# 2. Replace SERVICE with your actual service name (e.g., docker, nginx, etc.)
#
# 3. Reload systemd and restart the service:
#    sudo systemctl daemon-reload
#    sudo systemctl restart SERVICE
#
# 4. Verify the override is working:
#    systemctl show SERVICE | grep -E "(MemoryDenyWriteExecute|ProtectSystem|CapabilityBoundingSet)"
#
# =============================================================================
# SECURITY CONSIDERATIONS
# =============================================================================
#
# This configuration significantly relaxes security hardening for development.
# It should ONLY be used on:
# - Development machines
# - Testing environments  
# - Services that explicitly need these capabilities
#
# DO NOT use this override on production systems or services that don't need it.
# Always prefer service-specific minimal overrides when possible.
#
# For production systems, create targeted overrides with only the specific
# capabilities and permissions your service actually requires.